specVersion: "4.0"
metadata:
  name: demo.host
type: application
framework:
  name: OpenUI5
  version: "1.136.21"
  # The embedded abap2UI5 apps load whatever library their ABAP view names -
  # the hello world app uses sap.ui.layout (SimpleForm). List every library
  # your ABAP apps use, not only the ones this host app uses itself.
  # abap2UI5's developer tools (Ctrl+F12 in an embedded app) need
  # sap.ui.codeeditor - without it `ui5 serve` answers them with a 404.
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ui.codeeditor
    - name: themelib_sap_horizon
# The control comes from npm like any dependency; `ui5 serve` serves it
# anyway, `ui5 build` copies it into dist/thirdparty/z2ui5/embed/ only when
# it is named here. The abap2UI5 frontend is no part of the build: the
# control loads it from the backend at run time.
builder:
  settings:
    includeDependency:
      - "@abap2ui5/embed-control"
server:
  customMiddleware:
    # /sap/** goes to the SAP system that runs abap2UI5: set its URL here,
    # user and password in .env (.env.example). The proxy tells the backend
    # the dev server's host in X-Forwarded-Host, which abap2UI5's CSRF check
    # compares the browser's Origin with - nothing else is needed.
    # `npm run start-local` runs against a local backend instead
    # (ui5-local.yaml).
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /sap
      configuration:
        baseUri: https://my-sap-system:44300/sap
