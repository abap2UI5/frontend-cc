name: guard

# The convention gate of this repository - the same one abap2UI5/frontend has.
#
# abap2UI5/samples-embed-control is a DELIVERY repository: everything it
# ships is produced somewhere else and written here by a machine.
#
#   result/standard  on main - the finished tree (the examples as UI5
#                    projects in freestyle/, fiori-elements/,
#                    fiori-elements-v2/ and card/, the freestyle one as BSP in
#                    src/), written as one commit per change by
#                    abap2UI5/embed-control's frontend_deploy workflow
#   result/rap       on main - the same for the branch rap (the RAP service
#                    of fiori-elements-v2 and that app as BSP in src/)
#   README.md        on main - written by the same workflow from
#                    delivery/README.md over there, the README the branch
#                    carries too
#   standard, rap    fanned out from result/<branch> by the deliver
#                    workflow here: one commit ahead of main, its tree the
#                    content of the folder and nothing else
#
# None of that arrives through a pull request, and a hand-written change to
# generated content is an invisible failure: it survives review and merge and
# disappears on the next delivery. So the default answer to a pull request
# here is NO.
#
# The one exception is the repository's own docs and workflows - AGENTS.md,
# CONTRIBUTING.md, CLAUDE.md, .github/. Such a pull request opts out of the
# lock by carrying the label
#
#     maintenance
#
# which only accounts with triage or write permission can set, so a
# contributor cannot unlock their own pull request. Applying it re-runs this
# gate (the "labeled" trigger below).
#
# Enforcement note for repository admins: make the "guard" job a required
# status check on main so the lock cannot be merged around.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Only main accepts pull requests
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "::error::'$BASE' is a generated branch - fanned out from main's result/ folder by the deliver workflow, one commit ahead of main, rewritten on every delivery. A commit made here is discarded on the next one. Change the source in abap2UI5/embed-control instead."
            exit 1
          fi

      # result/ and README.md are machine-written by embed-control's
      # frontend_deploy; anything else outside the docs would be a file
      # that belongs over there, or a second copy of one.
      - name: hand edits stay within the docs
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE"
          stray=$(git diff --name-only --diff-filter=d "origin/$BASE...HEAD" \
            | grep -Ev '^(\.github/|[A-Z_]+\.md$|LICENSE$|\.gitattributes$)' || true)
          readme=$(git diff --name-only "origin/$BASE...HEAD" | grep -Ex 'README\.md' || true)
          stray=$(printf '%s\n%s\n' "$stray" "$readme" | sed '/^$/d')
          if [ -n "$stray" ]; then
            echo "::error::A pull request here may only touch the docs. result/ and README.md are machine-written by abap2UI5/embed-control's frontend_deploy workflow and overwritten on the next delivery - the app, the control, the build and the README live there (examples/, packages/embed-control, scripts/build-bsp.mjs, delivery/README.md), the abap2UI5 frontend in abap2UI5/abap2UI5."
            echo ""
            echo "Files a pull request may not touch:"
            echo "$stray" | sed 's/^/  /'
            echo ""
            echo "The maintenance label does not lift this."
            exit 1
          fi
          echo "docs only"

      - name: Pull requests are locked by default
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'maintenance') }}
        run: |
          echo "::error::This repository does not take manual pull requests. Its content is written by automation: abap2UI5/embed-control commits the finished tree into main's result/standard folder, and the deliver workflow makes the branch standard of it."
          echo ""
          echo "  Where a change belongs"
          echo "  ----------------------"
          echo "  the example apps, the control, the build, the README"
          echo "      -> abap2UI5/embed-control (examples/,"
          echo "         packages/embed-control, scripts/build-bsp.mjs,"
          echo "         delivery/README.md)"
          echo "  the abap2UI5 frontend, ?z2ui5-bundle, the BSP tooling"
          echo "      -> abap2UI5/abap2UI5 (app/webapp, tools/) - the branch"
          echo "         carries no copy of the frontend, and the build takes"
          echo "         the tools from abap2UI5's main"
          echo "  this repository's own docs and workflows"
          echo "      -> here, as a maintenance pull request: a maintainer"
          echo "         adds the label 'maintenance', which re-runs this check."
          echo ""
          echo "  Full rationale: CONTRIBUTING.md."
          exit 1

      - name: Maintenance change acknowledged
        if: ${{ contains(github.event.pull_request.labels.*.name, 'maintenance') }}
        run: |
          echo "maintenance label set - treated as a change to this repository's"
          echo "own docs. Generated content stays blocked by the checks above."
