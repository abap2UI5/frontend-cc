name: deliver

# The second half of the delivery relay - the same one abap2UI5/frontend runs.
#
# abap2UI5/embed-control builds the branch (scripts/build-bsp.mjs) and its
# frontend_deploy workflow writes the stamped result as result/<branch>
# into ONE commit on main here - today one folder, result/standard. This
# workflow turns it into the branch abapGit actually uses: on every push to
# main it writes, per branch, one commit
#
#     parent = the main commit
#     tree   = the content of result/<branch>, nothing else
#
# and force-pushes it. So every branch is always exactly one commit ahead of
# main, and main's history shows every change a branch ever received as one
# diff under result/<branch>. The force is by construction: the previous tip
# (old main + its folder) is never an ancestor of the new one. Nobody
# develops on these branches, so there is no history to lose.
#
# A docs-only commit to main moves the branches too - same tree, new parent -
# which keeps the invariant: one commit ahead of main, always.
#
# It builds nothing - the tree arrives finished, stamp included - and it does
# not touch a branch without a result/ folder on main. The branches
# standard_v2, cloud and cloud_v2 of the earlier build are no longer in the
# list: they carried a copy of the frontend, which the control now loads from
# the system, and nothing builds them any more.
#
# It runs on GITHUB_TOKEN: main is only ever pushed from embed-control via
# deploy key or merged into by a maintenance pull request, and both trigger
# this run; the branch it pushes triggers nothing (filter: main).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  fan_out:
    # the repository's name since its rename from frontend-cc - a fork, or
    # a name this does not match, fans out nothing
    if: github.repository == 'abap2UI5/frontend-embed-control'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: One commit per branch, on top of main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          for b in standard; do
            tree=$(git rev-parse --verify --quiet "$GITHUB_SHA:result/$b" || true)
            if [ -z "$tree" ]; then
              echo "$b: no result/$b on main, skipped"
              continue
            fi

            # Idempotence for re-runs: the tip this push would write is
            # already there. Read the parent from the raw object - the fetch
            # is shallow, so the graft would hide it from rev-parse.
            tip=$(git fetch --quiet --depth 1 origin "$b" 2>/dev/null && git rev-parse FETCH_HEAD || true)
            if [ -n "$tip" ] \
              && [ "$(git rev-parse "$tip^{tree}")" = "$tree" ] \
              && [ "$(git cat-file commit "$tip" | sed -n 's/^parent //p' | head -n 1)" = "$GITHUB_SHA" ]; then
              echo "$b: already one commit ahead of main, skipped"
              continue
            fi

            # The branch commit reuses main's message: the parent link says
            # where the content is tracked, the message says what changed.
            commit=$(git log -1 --format=%B "$GITHUB_SHA" | git commit-tree "$tree" -p "$GITHUB_SHA")
            git push --force --quiet origin "$commit:refs/heads/$b"
            echo "$b: pushed $commit"
          done
